spring.application.name=studio-many-scheduling-actions-service

# Servico sem camada HTTP: todo comando entra pela fila do RabbitMQ.
# Modo NONE mantem a aplicacao como worker (nao sobe container web).
spring.main.web-application-type=none

# WhatsApp - provedor de envio: waha | twilio | noop
whatsapp.provider=waha

# WAHA (WhatsApp HTTP API)
waha.api.url=${WAHA_API_URL:http://localhost:3000}
waha.api.apikey=${WAHA_API_KEY:}
waha.session=${WAHA_SESSION:Teste}

# Twilio (WhatsApp Business API) - usado quando whatsapp.provider=twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
# API Key (opcional) - se preenchida, autentica como API Key + Secret + Account SID
twilio.api-key-sid=${TWILIO_API_KEY_SID:}
# Numero de origem no formato whatsapp:+5511987654321
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:}

# RabbitMQ - credenciais OBRIGATORIAS do usuario exclusivo deste servico.
# Sem valor padrao de proposito: nao existe fallback inseguro (ex.: admin/admin).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# TLS (amqps) quando o trafego sai da rede privada (producao): RABBITMQ_SSL=true
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}

# Fila de notificacoes: 3 tentativas com espera crescente; erros de negocio
# (payload invalido) e falha de envio vao para a DLQ, sem reenfileiramento.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2

# Desliga o consumo sem desligar a aplicacao (ex.: testes, ambiente sem broker)
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:true}
